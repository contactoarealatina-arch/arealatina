{% extends 'base.html' %}

{% block titulo %}Iniciar sesión | Área Latina Estudio{% endblock %}

{% block contenido %}
<section class="seccion" style="padding-top: calc(var(--navbar-alto) + 64px);">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="card-al">
                    <div class="text-center mb-4">
                        <span class="etiqueta">Panel interno</span>
                        <h1 class="h3 mb-0">Iniciar sesión</h1>
                    </div>

                    {% if form.errors %}
                        <div class="alert alert-danger">
                            Usuario o contraseña incorrectos. Inténtalo de nuevo.
                        </div>
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="{{ form.username.id_for_label }}" class="form-label">Usuario</label>
                            <input type="text" name="username" id="{{ form.username.id_for_label }}"
                                   class="form-control" autofocus required>
                        </div>
                        <div class="mb-4">
                            <label for="{{ form.password.id_for_label }}" class="form-label">Contraseña</label>
                            <input type="password" name="password" id="{{ form.password.id_for_label }}"
                                   class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-acento w-100">Entrar</button>
                        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
